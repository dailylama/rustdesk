name: HDR branch build

# workflow_dispatch only works for workflows on the default branch, so builds
# of the hdr branch are started by pushing a commit whose message has [build].
on:
  push:
    branches:
      - hdr

jobs:
  run-flutter-build:
    if: contains(github.event.head_commit.message, '[build]')
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "hdr-build"
